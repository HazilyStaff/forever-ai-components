name: Test and deploy the library

# Every change to main is built and tested. If it passes, it is published to Cloudflare Pages
# and the live site is checked to make sure it still refuses visitors who are not signed in.
# Pull requests are built and tested but never published.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Validate the catalogue and build the site
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser tests (desktop, iPhone, iPad)
        run: npm run test:e2e

      - name: Keep the built site for the deploy job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: dashboard/dist
          retention-days: 3

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Explain a skipped deployment
        if: env.CLOUDFLARE_API_TOKEN == ''
        working-directory: .
        run: |
          echo "### Not deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "The CLOUDFLARE_API_TOKEN secret is not set for this repository, so the tested site was not published. See dashboard/docs/DEPLOYMENT.md." >> "$GITHUB_STEP_SUMMARY"

      - name: Use Node.js 22
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci

      - name: Fetch the tested site
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: dashboard/dist

      - name: Refuse a superseded main commit
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"

      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler pages deploy dist --project-name forever-components --branch main --commit-hash "${GITHUB_SHA}" --commit-message "Deploy ${GITHUB_SHA::10}"

      - name: Check the live site refuses visitors who are not signed in
        if: env.CLOUDFLARE_API_TOKEN != '' && env.SITE_URL != ''
        run: node scripts/verify-live.mjs "${SITE_URL}"
